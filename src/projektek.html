<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projektek | Pilot Erőforrás</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared.css" />
</head>
<body>

<div class="app-layout">

  <!-- ─── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div>
        <div class="brand-label">Pilot</div>
        <div class="brand-name">Erőforrás</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <!-- Dashboard -->
      <a class="nav-item" href="./index.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        Dashboard
      </a>
      <!-- Sofőrök -->
      <a class="nav-item" href="./soforok.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.4"/>
          <path d="M2 14c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Sofőrök
      </a>
      <!-- Projektek — aktív -->
      <a class="nav-item active" href="./projektek.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Projektek
      </a>
      <!-- Gépek -->
      <a class="nav-item" href="./gepek.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="6" width="10" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <path d="M11 8h2.5l1 2.5V12h-3.5V8z" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="4" cy="12" r="1.2" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="11.5" cy="12" r="1.2" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        Gépek
      </a>
      <div class="nav-divider"></div>
      <!-- Napi rögzítés -->
      <a class="nav-item" href="./napi_rogzites.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M2 7h12" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5.5 10.5l1.5 1.5 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Napi rögzítés
      </a>
      <!-- Napi tervezés -->
      <a class="nav-item" href="./napi_tervezes.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M2 7h12" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5 10h6M5 12.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Napi tervezés
      </a>
      <!-- Import / Export -->
      <a class="nav-item" href="./import_export.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 2v8M5 7l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 12h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Import / Export
      </a>
      <!-- Beállítások -->
      <a class="nav-item" href="./settings.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Beállítások
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-info" id="sidebarUserInfo">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.3"/>
          <path d="M2 14c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span id="sidebarUserName">—</span>
      </div>
    </div>
  </aside>

  <!-- ─── Fő tartalom ──────────────────────────────────────────────────────── -->
  <div class="main-content">

    <!-- Page Header -->
    <header class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">Projektek</h1>
        <div class="page-subtitle"><span id="subtitle">Betöltés...</span></div>
      </div>
      <div class="page-header-right">
        <div class="search-input">
          <input type="text" id="searchInput" placeholder="Keresés munkaszám vagy helyszín..." />
        </div>
        <button class="btn-primary" id="btnNew">+ Új projekt</button>
      </div>
    </header>

    <!-- Szűrő tabok -->
    <div class="filter-tabs">
      <div class="filter-tab filter-tab--active" id="filterAll">
        Összes <span class="tab-count" id="countAll">0</span>
      </div>
      <div class="filter-tab" id="filterActive">
        Aktív <span class="tab-count" id="countActive">0</span>
      </div>
      <div class="filter-tab" id="filterClosed">
        Lezárva <span class="tab-count" id="countClosed">0</span>
      </div>
    </div>

    <!-- Tartalomterület -->
    <div class="content-area">

      <!-- Táblázat -->
      <div class="table-container" id="tableContainer">
        <div class="table-header-row">
          <div style="width:160px; flex-shrink:0;">Munkaszám</div>
          <div style="flex:2; min-width:0;">Helyszín</div>
          <div style="flex:2; min-width:0;">Megrendelő</div>
          <div style="width:90px; flex-shrink:0;">Státusz</div>
          <div style="width:80px; flex-shrink:0;"></div>
        </div>
        <div id="tableBody"></div>
      </div>

      <!-- Form panel -->
      <div class="form-panel" id="formPanel" style="display:none;">
        <div class="form-panel-header">
          <span class="form-panel-title" id="formTitle">Új projekt</span>
          <button class="action-btn" id="btnPanelClose" title="Bezárás">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="form-panel-body">
          <div class="form-field">
            <label class="form-label" for="inputMunkaszam">Munkaszám <span style="color:var(--color-error)">*</span></label>
            <input class="form-input" type="text" id="inputMunkaszam" placeholder="pl. 2024-001" style="font-family:'Courier New',monospace; font-size:13px;" />
            <span class="form-error" id="errorMunkaszam">A munkaszám megadása kötelező.</span>
          </div>
          <div class="form-field">
            <label class="form-label" for="inputHelyszin">Helyszín</label>
            <input class="form-input" type="text" id="inputHelyszin" placeholder="pl. Budapest, XIV. ker." />
          </div>
          <div class="form-field">
            <label class="form-label" for="inputMegrendelo">Megrendelő</label>
            <input class="form-input" type="text" id="inputMegrendelo" placeholder="pl. Kovács Kft." />
          </div>
          <div class="form-field">
            <label class="form-label" for="inputStatusz">Státusz</label>
            <select class="form-select" id="inputStatusz">
              <option value="aktiv">Aktív</option>
              <option value="lezarva">Lezárva</option>
            </select>
          </div>
        </div>
        <div class="form-panel-footer">
          <button class="btn-secondary" id="btnCancel">Mégse</button>
          <button class="btn-primary" id="btnSave">Mentés</button>
        </div>
      </div>

    </div><!-- /.content-area -->

  </div><!-- /.main-content -->
</div><!-- /.app-layout -->

<script type="module">
  import { initDB, getDB, saveToIndexedDB } from './db.js';
  import { createProjekt, getAllProjektek, updateProjekt, deleteProjekt } from './crud.js';
  import { getIdentity } from './identity.js';

  // ─── Állapot ────────────────────────────────────────────────────────────────

  let currentFilter = 'all';  // 'all' | 'aktiv' | 'lezarva'
  let editingId     = null;
  let allProjektek  = [];
  let filterText    = '';

  // ─── Inicializálás ──────────────────────────────────────────────────────────

  // Sidebar felhasználónév feltöltése
  document.getElementById('sidebarUserName').textContent = getIdentity().name;

  try {
    await initDB();

    // A projekt táblában nincs statusz oszlop az alap sémában — hozzáadjuk, ha hiányzik.
    // SQLite ALTER TABLE ADD COLUMN hibát dob, ha az oszlop már létezik → elnyomjuk.
    try {
      getDB().run(`ALTER TABLE projekt ADD COLUMN statusz TEXT DEFAULT 'aktiv'`);
    } catch (_) {
      // Oszlop már létezik — normális eset újratöltésnél
    }

    await loadAndRender();
  } catch (err) {
    document.querySelector('.content-area').innerHTML =
      '<div class="error-banner">Adatbázis hiba — töltsd újra az oldalt</div>';
    console.error('[projektek] initDB hiba:', err);
  }

  // ─── Adatbetöltés ───────────────────────────────────────────────────────────

  async function loadAndRender() {
    allProjektek = getAllProjektek();
    updateCounts();
    renderTable();
  }

  function updateCounts() {
    const total   = allProjektek.length;
    const aktiv   = allProjektek.filter(p => (p.statusz || 'aktiv') === 'aktiv').length;
    const lezarva = allProjektek.filter(p => p.statusz === 'lezarva').length;

    document.getElementById('countAll').textContent    = total;
    document.getElementById('countActive').textContent = aktiv;
    document.getElementById('countClosed').textContent = lezarva;
    document.getElementById('subtitle').textContent    = `${total} projekt összesen`;
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');

    // Szűrés státusz alapján
    let filtered = allProjektek.filter(p => {
      const st = p.statusz || 'aktiv';
      if (currentFilter === 'aktiv')   return st === 'aktiv';
      if (currentFilter === 'lezarva') return st === 'lezarva';
      return true;
    });

    // Keresés munkaszámban VAGY helyszínben (OR logika)
    if (filterText) {
      const q = filterText.toLowerCase();
      filtered = filtered.filter(p =>
        (p.munkaszam || '').toLowerCase().includes(q) ||
        (p.helyszin  || '').toLowerCase().includes(q)
      );
    }

    if (filtered.length === 0) {
      tbody.innerHTML = '<div class="table-empty">Nincs megjeleníthető projekt.</div>';
      return;
    }

    tbody.innerHTML = filtered.map(p => createRowHTML(p)).join('');
  }

  // ─── Sor HTML generálás ──────────────────────────────────────────────────────

  function createRowHTML(projekt) {
    const isLezarva  = (projekt.statusz || 'aktiv') === 'lezarva';
    const rowClass   = isLezarva ? 'table-row table-row--inactive' : 'table-row';
    const badgeClass = isLezarva ? 'badge badge--lezarva' : 'badge badge--active';
    const badgeText  = isLezarva ? 'Lezárva' : 'Aktív';
    const btnDisabled = isLezarva ? 'action-btn--disabled' : '';

    return `
      <div class="${rowClass}" data-id="${projekt.id}">
        <div style="width:160px; flex-shrink:0; font-family:'Courier New',monospace; font-size:12px; color:var(--color-text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          ${escHtml(projekt.munkaszam || '—')}
        </div>
        <div style="flex:2; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          ${escHtml(projekt.helyszin || '—')}
        </div>
        <div style="flex:2; min-width:0; color:var(--color-text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          ${escHtml(projekt.megrendelo || '—')}
        </div>
        <div style="width:90px; flex-shrink:0;">
          <span class="${badgeClass}">${badgeText}</span>
        </div>
        <div style="width:80px; flex-shrink:0; display:flex; align-items:center; justify-content:flex-end; gap:4px;">
          <button class="action-btn action-btn--edit ${btnDisabled}" title="Szerkesztés" onclick="handleEdit(${projekt.id})">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.5 2.5l2 2L4 12H2v-2l7.5-7.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="action-btn action-btn--delete ${btnDisabled}" title="Törlés" onclick="handleDelete(${projekt.id})">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 3.5h10M5 3.5V2h4v1.5M5.5 6v4M8.5 6v4M3 3.5l.7 8h6.6l.7-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    `;
  }

  // ─── Form kezelés ────────────────────────────────────────────────────────────

  function openNewForm() {
    editingId = null;
    document.getElementById('formTitle').textContent   = 'Új projekt';
    document.getElementById('inputMunkaszam').value    = '';
    document.getElementById('inputHelyszin').value     = '';
    document.getElementById('inputMegrendelo').value   = '';
    document.getElementById('inputStatusz').value      = 'aktiv';
    document.getElementById('formPanel').style.display = 'flex';
    document.getElementById('inputMunkaszam').focus();
  }

  function openEditForm(id) {
    const projekt = allProjektek.find(p => p.id === id);
    if (!projekt) return;

    editingId = id;
    document.getElementById('formTitle').textContent   = 'Szerkesztés';
    document.getElementById('inputMunkaszam').value    = projekt.munkaszam  || '';
    document.getElementById('inputHelyszin').value     = projekt.helyszin   || '';
    document.getElementById('inputMegrendelo').value   = projekt.megrendelo || '';
    document.getElementById('inputStatusz').value      = projekt.statusz    || 'aktiv';
    document.getElementById('formPanel').style.display = 'flex';
    document.getElementById('inputMunkaszam').focus();
  }

  function closeForm() {
    document.getElementById('formPanel').style.display = 'none';
    editingId = null;
  }

  // ─── Mentés ──────────────────────────────────────────────────────────────────

  async function handleSave() {
    const munkaszam = document.getElementById('inputMunkaszam').value.trim();
    if (!munkaszam) {
      const input = document.getElementById('inputMunkaszam');
      input.focus();
      input.style.borderColor = 'var(--color-error)';
      document.getElementById('errorMunkaszam').classList.add('visible');
      return;
    }

    const data = {
      munkaszam:  munkaszam,
      helyszin:   document.getElementById('inputHelyszin').value.trim()   || null,
      megrendelo: document.getElementById('inputMegrendelo').value.trim() || null,
      statusz:    document.getElementById('inputStatusz').value,
      // A statusz mező nem natív a crud.js updateProjekt-ben, ezért közvetlen SQL-lel kezeljük
    };

    try {
      if (editingId !== null) {
        // Alap mezők frissítése a crud.js-sel
        updateProjekt(editingId, {
          munkaszam:  data.munkaszam,
          helyszin:   data.helyszin,
          megrendelo: data.megrendelo,
        });
        // Statusz frissítése közvetlen SQL-lel (extra oszlop)
        getDB().run('UPDATE projekt SET statusz = ? WHERE id = ?', [data.statusz, editingId]);
      } else {
        const newId = createProjekt({
          munkaszam:  data.munkaszam,
          helyszin:   data.helyszin,
          megrendelo: data.megrendelo,
        });
        // Statusz beállítása az új rekordra
        getDB().run('UPDATE projekt SET statusz = ? WHERE id = ?', [data.statusz, newId]);
      }
      await saveToIndexedDB();
      closeForm();
      await loadAndRender();
    } catch (err) {
      // Duplikált munkaszám jelzése
      if (err.message && err.message.includes('UNIQUE')) {
        alert('Ez a munkaszám már létezik: ' + data.munkaszam);
      } else {
        alert('Hiba a mentés során: ' + err.message);
      }
    }
  }

  // ─── Törlés ──────────────────────────────────────────────────────────────────

  async function handleDelete(id) {
    if (!confirm('Biztosan törli ezt a projektet?')) return;
    try {
      deleteProjekt(id);
      await saveToIndexedDB();
      if (editingId === id) closeForm();
      await loadAndRender();
    } catch (err) {
      alert('Törlési hiba: ' + err.message);
    }
  }

  // ─── Globális handlerek ──────────────────────────────────────────────────────

  window.handleEdit   = (id) => openEditForm(id);
  window.handleDelete = (id) => handleDelete(id);

  // ─── Eseménykezelők ──────────────────────────────────────────────────────────

  document.getElementById('btnNew').onclick        = () => openNewForm();
  document.getElementById('btnSave').onclick       = () => handleSave();
  document.getElementById('btnCancel').onclick     = () => closeForm();
  document.getElementById('btnPanelClose').onclick = () => closeForm();

  // Hibajelzés törlése gépeléskor
  document.getElementById('inputMunkaszam').oninput = () => {
    document.getElementById('inputMunkaszam').style.borderColor = '';
    document.getElementById('errorMunkaszam').classList.remove('visible');
  };

  document.getElementById('searchInput').oninput = (e) => {
    filterText = e.target.value.trim();
    renderTable();
  };

  document.getElementById('filterAll').onclick    = () => setFilter('all');
  document.getElementById('filterActive').onclick = () => setFilter('aktiv');
  document.getElementById('filterClosed').onclick = () => setFilter('lezarva');

  function setFilter(f) {
    currentFilter = f;
    document.getElementById('filterAll').className    = 'filter-tab' + (f === 'all'     ? ' filter-tab--active' : '');
    document.getElementById('filterActive').className = 'filter-tab' + (f === 'aktiv'   ? ' filter-tab--active' : '');
    document.getElementById('filterClosed').className = 'filter-tab' + (f === 'lezarva' ? ' filter-tab--active' : '');
    renderTable();
  }

  // ─── Segédfüggvény ───────────────────────────────────────────────────────────

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
