    <!-- Tartalomterület -->

      <!-- Táblázat -->
      <div class="table-container" id="tableContainer">
        <div class="table-header-row">
          <div style="flex:2; min-width:0;">Csoport neve</div>
          <div style="width:120px; flex-shrink:0;">Gépek száma</div>
          <div style="width:80px; flex-shrink:0;"></div>
        </div>
        <div id="tableBody"></div>
      </div>

      <!-- Form panel -->
      <div class="form-panel" id="formPanel" style="display:none;">
        <div class="form-panel-header">
          <span class="form-panel-title" id="formTitle">Új csoport</span>
          <button class="action-btn" id="btnPanelClose" title="Bezárás">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="form-panel-body">
          <div class="form-field">
            <label class="form-label" for="inputNev">Csoport neve <span style="color:var(--color-error)">*</span></label>
            <input class="form-input" type="text" id="inputNev" placeholder="pl. 4 tengelyes" />
            <span class="form-error" id="errorNev">A csoport neve kötelező.</span>
          </div>
        </div>
        <div class="form-panel-footer">
          <button class="btn-secondary" id="btnCancel">Mégse</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script type="module">
  import { initDB, saveToIndexedDB } from './db.js';
  import { createGepCsoport, getAllGepCsoport, updateGepCsoport, deleteGepCsoport, getAllGepek } from './crud.js';
  import { requireAuth, logout, isAdmin } from './auth.js';

  const session = requireAuth('admin');

  // ─── Állapot ────────────────────────────────────────────────────────────────

  let editingId    = null;
  let allCsoportok = [];

  // ─── Inicializálás ──────────────────────────────────────────────────────────

  document.getElementById('sidebarUserName').textContent = session.nev;
  if (isAdmin()) document.getElementById('navAdminItem').style.display = '';
  document.getElementById('btnLogout').addEventListener('click', () => logout());

  try {
    await initDB();
    await seedDefaultCsoportok();
    await loadAndRender();
  } catch (err) {
    document.querySelector('.content-area').innerHTML =
      '<div class="error-banner">Adatbázis hiba — töltsd újra az oldalt</div>';
    console.error('[gep_csoportok] initDB hiba:', err);
  }

  // ─── Alapértelmezett csoportok seed ─────────────────────────────────────────

  async function seedDefaultCsoportok() {
    const meglevo = getAllGepCsoport();
    if (meglevo.length > 0) return;

    const defaults = [
      '4 tengelyes',
      '3 tengelyes',
      'Kombikotró',
      'Dózer',
      'Daru',
    ];

    for (const nev of defaults) {
      try {
        createGepCsoport(nev);
      } catch (err) {
        console.warn('[gep_csoportok] Seed hiba:', nev, err.message);
      }
    }

    await saveToIndexedDB();
    console.log('[gep_csoportok] Alapértelmezett csoportok létrehozva.');
  }

  // ─── Adatbetöltés ───────────────────────────────────────────────────────────

  async function loadAndRender() {
    allCsoportok = getAllGepCsoport();
    document.getElementById('subtitle').textContent = `${allCsoportok.length} csoport összesen`;
    renderTable();
  }

  function renderTable() {
    const tbody   = document.getElementById('tableBody');
    const allGepek = getAllGepek();

    if (allCsoportok.length === 0) {
      tbody.innerHTML = '<div class="table-empty">Nincs megjeleníthető csoport.</div>';
      return;
    }

    tbody.innerHTML = allCsoportok.map(c => {
      const gepSzam = allGepek.filter(g => g.csoport_id === c.id).length;
      return `
        <div class="table-row" data-id="${c.id}">
          <div style="flex:2; min-width:0;">
            <div style="font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
              ${escHtml(c.nev)}
            </div>
          </div>
          <div style="width:120px; flex-shrink:0; color:var(--color-text-secondary); font-size:13px;">
            ${gepSzam} gép
          </div>
          <div style="width:80px; flex-shrink:0; display:flex; align-items:center; justify-content:flex-end; gap:4px;">
            <button class="action-btn action-btn--edit" title="Szerkesztés" onclick="handleEdit(${c.id})">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.5 2.5l2 2L4 12H2v-2l7.5-7.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="action-btn action-btn--delete" title="Törlés" onclick="handleDelete(${c.id})">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 3.5h10M5 3.5V2h4v1.5M5.5 6v4M8.5 6v4M3 3.5l.7 8h6.6l.7-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  // ─── Form kezelés ────────────────────────────────────────────────────────────

  function openNewForm() {
    editingId = null;
    document.getElementById('formTitle').textContent   = 'Új csoport';
    document.getElementById('inputNev').value          = '';
    document.getElementById('errorNev').classList.remove('visible');
    document.getElementById('inputNev').style.borderColor = '';
    document.getElementById('formPanel').style.display = 'flex';
    document.getElementById('inputNev').focus();
  }

  function openEditForm(id) {
    const csoport = allCsoportok.find(c => c.id === id);
    if (!csoport) return;

    editingId = id;
    document.getElementById('formTitle').textContent   = 'Szerkesztés';
    document.getElementById('inputNev').value          = csoport.nev;
    document.getElementById('errorNev').classList.remove('visible');
    document.getElementById('inputNev').style.borderColor = '';
    document.getElementById('formPanel').style.display = 'flex';
    document.getElementById('inputNev').focus();
  }

  function closeForm() {
    document.getElementById('formPanel').style.display = 'none';
    editingId = null;
  }

  // ─── Mentés ──────────────────────────────────────────────────────────────────

  async function handleSave() {
    const nev = document.getElementById('inputNev').value.trim();
    if (!nev) {
      const input = document.getElementById('inputNev');
      input.focus();
      input.style.borderColor = 'var(--color-error)';
      document.getElementById('errorNev').classList.add('visible');
      return;
    }

    try {
      if (editingId !== null) {
        updateGepCsoport(editingId, nev);
      } else {
        createGepCsoport(nev);
      }
      await saveToIndexedDB();
      closeForm();
      await loadAndRender();
    } catch (err) {
      // UNIQUE constraint violation: a név már foglalt
      if (err.message?.includes('UNIQUE') || err.message?.includes('unique')) {
        alert('Ez a csoport neve már létezik. Kérjük, adjon meg egyedi nevet.');
      } else {
        alert('Hiba a mentés során: ' + err.message);
      }
    }
  }

  // ─── Törlés ──────────────────────────────────────────────────────────────────

  async function handleDelete(id) {
    const csoport  = allCsoportok.find(c => c.id === id);
    if (!csoport) return;

    const allGepek = getAllGepek();
    const gepSzam  = allGepek.filter(g => g.csoport_id === id).length;

    let uzenet = `Biztosan törli a(z) "${csoport.nev}" csoportot?`;
    if (gepSzam > 0) {
      uzenet += `\n\nFigyelem: ${gepSzam} gép tartozik ehhez a csoporthoz. A törlés után ezek a gépek csoport nélkül maradnak.`;
    }

    if (!confirm(uzenet)) return;

    try {
      deleteGepCsoport(id);
      await saveToIndexedDB();
      if (editingId === id) closeForm();
      await loadAndRender();
    } catch (err) {
      alert('Törlési hiba: ' + err.message);
    }
  }

  // ─── Globális handlerek ──────────────────────────────────────────────────────

  window.handleEdit   = (id) => openEditForm(id);
  window.handleDelete = (id) => handleDelete(id);

  // ─── Eseménykezelők ──────────────────────────────────────────────────────────

  document.getElementById('btnNew').onclick        = () => openNewForm();
  document.getElementById('btnSave').onclick       = () => handleSave();
  document.getElementById('btnCancel').onclick     = () => closeForm();
  document.getElementById('btnPanelClose').onclick = () => closeForm();

  document.getElementById('inputNev').oninput = () => {
    document.getElementById('inputNev').style.borderColor = '';
    document.getElementById('errorNev').classList.remove('visible');
  };

  // ─── Segédfüggvény ───────────────────────────────────────────────────────────

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
