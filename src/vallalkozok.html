      <!-- Táblázat -->

        <div class="table-header-row">

          <div style="width:80px; flex-shrink:0;"></div>
        </div>
        <div id="tableBody"></div>
      </div>

      <!-- Form panel -->

              <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

        </div>
        <div class="form-panel-body">
          <div class="form-field">
            <label class="form-label" for="inputNev">Cégnév <span style="color:var(--color-error)">*</span></label>

          </div>
        </div>
        <div class="form-panel-footer">

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script type="module">
  import { initDB, getDB, saveToIndexedDB } from './db.js';
  import { requireAuth, logout, isAdmin } from './auth.js';

  const session = requireAuth();

  // ─── Állapot ────────────────────────────────────────────────────────────────

  let editingNev = null; // szerkesztett cégnév (eredeti), null = új
  let allVallalkozok = [];

  // ─── Inicializálás ──────────────────────────────────────────────────────────

  document.getElementById('sidebarUserName').textContent = session.nev;
  if (isAdmin()) document.getElementById('navAdminItem').style.display = '';
  document.getElementById('btnLogout').addEventListener('click', () => logout());

  try {
    await initDB();
    loadAndRender();
    if (!isAdmin()) document.getElementById('btnNew').style.display = 'none';
  } catch (err) {
    document.querySelector('.content-area').innerHTML =
      '<div class="error-banner">Adatbázis hiba — töltsd újra az oldalt</div>';
  }

  // ─── Adatbetöltés ───────────────────────────────────────────────────────────

  function loadAndRender() {
    // Az egyedi vállalkozó neveket a gep táblából olvassuk ki
    const result = getDB().exec(
      `SELECT DISTINCT vallalkozo FROM gep WHERE vallalkozo IS NOT NULL AND vallalkozo != '' ORDER BY vallalkozo`
    );
    allVallalkozok = (result[0]?.values || []).map(r => r[0]);
    document.getElementById('subtitle').textContent = `${allVallalkozok.length} vállalkozó összesen`;
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    if (allVallalkozok.length === 0) {
      tbody.innerHTML = '<div class="table-empty">Nincs rögzített vállalkozó. Adj hozzá egyet a gépek oldalon, vagy kattints az "+ Új vállalkozó" gombra.</div>';
      return;
    }
    tbody.innerHTML = allVallalkozok.map(nev => `
      <div class="table-row" data-nev="${escHtml(nev)}">
        <div style="flex:1; min-width:0;">
          <div style="font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escHtml(nev)}</div>
          <div style="font-size:12px; color:var(--color-text-muted); margin-top:2px;">${gepSzam(nev)} gép kapcsolódik</div>
        </div>
        <div style="width:80px; flex-shrink:0; display:flex; align-items:center; justify-content:flex-end; gap:4px;">
          ${isAdmin() ? `
          <button class="action-btn action-btn--edit" title="Átnevezés" onclick="handleEdit('${escAttr(nev)}')">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M9.5 2.5l2 2L4 12H2v-2l7.5-7.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="action-btn action-btn--delete" title="Törlés" onclick="handleDelete('${escAttr(nev)}')">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 3.5h10M5 3.5V2h4v1.5M5.5 6v4M8.5 6v4M3 3.5l.7 8h6.6l.7-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>` : ''}
        </div>
      </div>
    `).join('');
  }

  function gepSzam(nev) {
    const r = getDB().exec(`SELECT COUNT(*) FROM gep WHERE vallalkozo = ?`, [nev]);
    return r[0]?.values[0]?.[0] ?? 0;
  }

  // ─── Form kezelés ────────────────────────────────────────────────────────────

  function openNewForm() {
    editingNev = null;
    document.getElementById('formTitle').textContent   = 'Új vállalkozó';
    document.getElementById('inputNev').value          = '';
    document.getElementById('formPanel').style.display = 'flex';
    document.getElementById('inputNev').focus();
  }

  function openEditForm(nev) {
    editingNev = nev;
    document.getElementById('formTitle').textContent   = 'Átnevezés';
    document.getElementById('inputNev').value          = nev;
    document.getElementById('formPanel').style.display = 'flex';
    document.getElementById('inputNev').focus();
  }

  function closeForm() {
    document.getElementById('formPanel').style.display = 'none';
    editingNev = null;
  }

  // ─── Mentés ──────────────────────────────────────────────────────────────────

  async function handleSave() {
    const nev = document.getElementById('inputNev').value.trim();
    if (!nev) {
      document.getElementById('inputNev').style.borderColor = 'var(--color-error)';
      document.getElementById('errorNev').classList.add('visible');
      return;
    }

    try {
      if (editingNev !== null) {
        // Átnevezés: UPDATE minden gép rekordot ahol a régi nevet használták
        getDB().run(
          `UPDATE gep SET vallalkozo = ?, updated_at = CURRENT_TIMESTAMP WHERE vallalkozo = ?`,
          [nev, editingNev]
        );
      } else {
        // Új vállalkozó: csak akkor adjuk hozzá ha nincs ilyen, és legalább egy géphez rendeljük
        if (allVallalkozok.includes(nev)) {
          alert('Ez a vállalkozó már szerepel az adatbázisban.');
          return;
        }
        // Üres vállalkozónál nem hozunk létre rekordot — a gépekhez rendelés a Gépek oldalon történik
        alert('Az új vállalkozó mentve. Rendelje hozzá gépekhez a Gépek oldalon.');
        // A nevet eltároljuk a gep táblában úgy, hogy egy temp sort hozunk létre?
        // Nem — inkább csak jelezzük, hogy ezt a Gépek oldalon kell elvégezni.
        closeForm();
        return;
      }
      await saveToIndexedDB();
      closeForm();
      loadAndRender();
    } catch (err) {
      alert('Hiba: ' + err.message);
    }
  }

  // ─── Törlés ──────────────────────────────────────────────────────────────────

  async function handleDelete(nev) {
    const db = getDB();
    const gepek = db.exec(`SELECT COUNT(*) FROM gep WHERE vallalkozo = ?`, [nev]);
    const szam = gepek[0]?.values[0]?.[0] ?? 0;
    const msg = szam > 0
      ? `A "${nev}" vállalkozóhoz ${szam} gép kapcsolódik. Törlés esetén a gépek vállalkozó mező ürül. Folytatja?`
      : `Biztosan törli: "${nev}"?`;
    if (!confirm(msg)) return;
    try {
      db.run(`UPDATE gep SET vallalkozo = NULL WHERE vallalkozo = ?`, [nev]);
      await saveToIndexedDB();
      loadAndRender();
    } catch (err) {
      alert('Törlési hiba: ' + err.message);
    }
  }

  // ─── Globális handlerek ──────────────────────────────────────────────────────

  window.handleEdit   = (nev) => openEditForm(nev);
  window.handleDelete = (nev) => handleDelete(nev);

  // ─── Eseménykezelők ──────────────────────────────────────────────────────────

  document.getElementById('btnNew').onclick        = () => openNewForm();
  document.getElementById('btnSave').onclick       = () => handleSave();
  document.getElementById('btnCancel').onclick     = () => closeForm();
  document.getElementById('btnPanelClose').onclick = () => closeForm();

  document.getElementById('inputNev').oninput = () => {
    document.getElementById('inputNev').style.borderColor = '';
    document.getElementById('errorNev').classList.remove('visible');
  };

  // ─── Segédfüggvények ─────────────────────────────────────────────────────────

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escAttr(str) {
    return String(str).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
  }
</script>
